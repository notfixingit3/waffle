name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syrup
          POSTGRES_PASSWORD: syrup
          POSTGRES_DB: syrup
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://syrup:syrup@localhost:5432/syrup?sslmode=disable
          JWT_SECRET: ci-test-secret
        run: go test ./... -count=1

      - name: Run vet
        working-directory: backend
        run: go vet ./...

      - name: Run govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build Docker image
        run: docker build -f Dockerfile .
