services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syrup
      POSTGRES_PASSWORD: syrup
      POSTGRES_DB: syrup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syrup -d syrup"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${WAFFLE_VERSION:-dev}
    ports:
      - "8383:8383"
    environment:
      DATABASE_URL: postgres://syrup:syrup@postgres:5432/syrup?sslmode=disable
      PORT: 8383
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-syrup}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/app/migrations
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8383/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
