<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — The Waffle Maker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #faf7f2;
      color: #5c3d2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 1rem;
      margin: 0 0 24px 0;
      opacity: 0.8;
    }
    button {
      background: #B45309;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <img src="/static/img/logo.png" alt="" class="logo" onerror="this.style.display='none'">
  <h1>You're Offline</h1>
  <p>Check your connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
