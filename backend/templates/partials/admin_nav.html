{{ define "admin_nav.html" }}
<nav class="navbar bg-neutral text-neutral-content shadow-lg">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-14">
      <a href="/admin/dashboard" class="flex items-center gap-2 font-bold text-lg no-underline hover:text-primary transition-colors">
        <img src="/static/img/logo.png" alt="" class="w-7 h-7 rounded">
        <span class="hidden sm:inline">Syrup Admin</span>
      </a>

      <button id="nav-toggle" type="button" class="md:hidden btn btn-ghost btn-square" aria-label="Toggle navigation" onclick="document.getElementById('nav-menu-mobile').classList.toggle('hidden')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <div class="hidden md:flex items-center gap-1 text-sm font-medium">
        <a href="/" class="btn btn-ghost btn-sm{{ if eq .CurrentPath "/" }} btn-active{{ end }}">Home</a>
        <a href="/admin/dashboard" class="btn btn-ghost btn-sm{{ if eq .CurrentPath "/admin/dashboard" }} btn-active{{ end }}">Dashboard</a>
        <a href="/admin/waffles/new" class="btn btn-ghost btn-sm{{ if eq .CurrentPath "/admin/waffles/new" }} btn-active{{ end }}">New Waffle</a>
        <a href="/admin/reports" class="btn btn-ghost btn-sm{{ if eq .CurrentPath "/admin/reports" }} btn-active{{ end }}">Reports</a>
        {{ if eq .Role "super_admin" }}
        <a href="/admin/admins" class="btn btn-ghost btn-sm{{ if eq .CurrentPath "/admin/admins" }} btn-active{{ end }}">Users</a>
        {{ end }}
      </div>

      <div class="hidden md:flex items-center gap-3">
        <span class="text-sm text-neutral-content/60">{{ .DisplayName }}</span>
        <form action="/admin/logout" method="POST" class="inline">
          <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
          <button type="submit" class="btn btn-primary btn-sm">Logout</button>
        </form>
      </div>
    </div>
  </div>

  <div id="nav-menu-mobile" class="hidden md:hidden bg-neutral-focus px-4 pb-3 text-sm font-medium space-y-1">
    <a href="/" class="btn btn-ghost btn-sm w-full text-left{{ if eq .CurrentPath "/" }} btn-active{{ end }}">Home</a>
    <a href="/admin/dashboard" class="btn btn-ghost btn-sm w-full text-left{{ if eq .CurrentPath "/admin/dashboard" }} btn-active{{ end }}">Dashboard</a>
    <a href="/admin/waffles/new" class="btn btn-ghost btn-sm w-full text-left{{ if eq .CurrentPath "/admin/waffles/new" }} btn-active{{ end }}">New Waffle</a>
    <a href="/admin/reports" class="btn btn-ghost btn-sm w-full text-left{{ if eq .CurrentPath "/admin/reports" }} btn-active{{ end }}">Reports</a>
    {{ if eq .Role "super_admin" }}
    <a href="/admin/admins" class="btn btn-ghost btn-sm w-full text-left{{ if eq .CurrentPath "/admin/admins" }} btn-active{{ end }}">Users</a>
    {{ end }}
    <div class="border-t border-neutral-focus pt-2 mt-2 flex items-center justify-between">
      <span class="text-sm text-neutral-content/60">{{ .DisplayName }}</span>
      <form action="/admin/logout" method="POST" class="inline">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        <button type="submit" class="btn btn-primary btn-sm">Logout</button>
      </form>
    </div>
  </div>
</nav>
{{ end }}
