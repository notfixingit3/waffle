{{ define "header.html" }}
<header class="navbar bg-base-100 border-b border-base-300 shadow-sm">
  <div class="container mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 no-underline hover:opacity-80 transition-opacity">
      <img src="/static/img/logo.png" alt="The Waffle Maker" class="w-8 h-8 rounded">
      <span class="text-lg font-bold text-base-content">The Waffle Maker</span>
    </a>
    <div class="flex items-center gap-2">
      <button id="theme-toggle" type="button" class="btn btn-ghost btn-sm btn-square" onclick="ThemeToggle.toggle()" aria-label="Toggle theme">
        <svg id="theme-sun" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="theme-moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
      <span class="text-sm text-base-content/60">Project Syrup</span>
    </div>
  </div>
</header>
{{ end }}
