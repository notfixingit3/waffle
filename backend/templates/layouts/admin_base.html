{{ define "admin_base.html" }}
<!DOCTYPE html>
<html lang="en" data-theme="syrup">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>{{ block "title" . }}Project Syrup{{ end }}</title>
  <link rel="stylesheet" href="/static/css/output.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Waffle Maker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#B45309">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  {{ block "head" . }}{{ end }}
</head>
<body class="bg-base-200 text-base-content min-h-dvh">
  {{ template "admin_nav.html" . }}
  <main class="container mx-auto px-4 py-6">
    {{ block "content" . }}{{ end }}
  </main>
  {{ template "footer.html" . }}
  {{ block "scripts" . }}{{ end }}
</body>
</html>
{{ end }}
