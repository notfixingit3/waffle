{{ define "admin_base.html" }}
<!DOCTYPE html>
<html lang="en" data-theme="syrup">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="csrf-token" content="{{ .CSRFToken }}">
  <title>{{ block "title" . }}Project Syrup{{ end }}</title>
  <link rel="stylesheet" href="/static/css/output.css">
  <script src="/static/js/theme-toggle.js"></script>
  <script>ThemeToggle.init();</script>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Waffle Maker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#B45309">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  {{ block "head" . }}{{ end }}
</head>
<body class="bg-base-200 text-base-content min-h-dvh">
  {{ template "admin_nav.html" . }}
  <main class="container mx-auto px-4 py-4">
    {{ block "content" . }}{{ end }}
  </main>
  {{ template "footer.html" . }}
  <script src="/static/js/footer-clock.js"></script>
  <script>FooterClock.init();</script>
  <script src="/static/js/toast.js"></script>
  <dialog id="admin-confirm-dialog" class="modal">
    <div class="modal-box max-w-sm">
      <h3 id="admin-confirm-title" class="font-bold text-lg">Confirm</h3>
      <p id="admin-confirm-message" class="py-4 text-sm opacity-70"></p>
      <div class="modal-action">
        <button id="admin-confirm-cancel" class="btn btn-ghost btn-sm">Cancel</button>
        <button id="admin-confirm-ok" class="btn btn-error btn-sm">Confirm</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>
  <script>
  var AdminConfirm = (function() {
    'use strict';
    var dialog, okBtn, pending;
    document.addEventListener('DOMContentLoaded', function() {
      dialog = document.getElementById('admin-confirm-dialog');
      okBtn  = document.getElementById('admin-confirm-ok');
      document.getElementById('admin-confirm-cancel').addEventListener('click', function() {
        dialog.close(); pending = null;
      });
      okBtn.addEventListener('click', function() {
        dialog.close();
        if (pending) { var fn = pending; pending = null; fn(); }
      });
    });
    function show(message, onConfirm, opts) {
      opts = opts || {};
      document.getElementById('admin-confirm-title').textContent   = opts.title || 'Confirm';
      document.getElementById('admin-confirm-message').textContent = message;
      okBtn.textContent  = opts.confirmLabel || 'Confirm';
      okBtn.className    = 'btn btn-sm ' + (opts.confirmClass || 'btn-error');
      pending = onConfirm;
      dialog.showModal();
    }
    return { show: show };
  })();
  </script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
{{ end }}
